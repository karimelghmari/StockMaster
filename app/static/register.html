<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory System - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4 card p-4 text-dark shadow">
                <h2 class="text-center mb-4">Create Account</h2>
                
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" id="regUsername" class="form-control" placeholder="Choose a username">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="Choose a password">
                </div>
                
                <button onclick="handleRegister()" class="btn btn-success w-100">Sign Up</button>
                
                <div id="regMessage" class="mt-3 text-center" style="display: none;"></div>
                
                <p class="mt-4 text-center">
                    Already have an account? <a href="/login">Login here</a>
                </p>
            </div>
        </div>
    </div>
    <script src="/static/auth.js"></script>
</body>
</html>
