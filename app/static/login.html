<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory System - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4 card p-4 text-dark shadow">
                <h2 class="text-center mb-4">Sign In</h2>
                
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" id="usernameInput" class="form-control" placeholder="Enter username">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="passwordInput" class="form-control" placeholder="Enter password">
                </div>
                
                <button onclick="handleLogin()" class="btn btn-primary w-100">Login</button>
                
                <div id="errorMessage" class="mt-3 text-danger text-center" style="display: none;"></div>
                
                <p class="mt-4 text-center">
                    Don't have an account? <a href="/static/register.html">Sign Up</a>
                </p>
            </div>
        </div>
    </div>

    <script src="/static/auth.js"></script>
</body>
</html>
